# Blue-Green Deployment：Blue 版本（目前生產版本）
# CKAD 考點：使用 labels 與 Service selector 實現 Blue-Green 部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
  namespace: demo
  labels:
    app: webapp
    version: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
      version: blue
  template:
    metadata:
      labels:
        app: webapp
        version: blue
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - |
              echo "Blue version (v1) running on $(hostname)"
              while true; do sleep 10; done
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
