# Canary Deployment：金絲雀版本（接收少量流量）
# 流量比例由 Pod 數量決定：stable(4) : canary(1) = 80% : 20%
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-canary
  namespace: demo
  labels:
    app: canary-app
    track: canary
spec:
  # 只有 1 個副本，佔 1/(4+1) = 20% 流量
  replicas: 1
  selector:
    matchLabels:
      app: canary-app
      track: canary
  template:
    metadata:
      labels:
        # 與 stable 共用 app: canary-app label，讓 Service 能選到
        app: canary-app
        track: canary
        version: v2
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - |
              echo "Canary v2 on $(hostname)"
              while true; do sleep 10; done
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
