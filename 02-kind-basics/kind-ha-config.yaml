# Kind HA (High Availability) 叢集設定檔
# 3 個 Control Plane + 3 個 Worker 節點
# 使用方式: kind create cluster --name ha-cluster --config kind-ha-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: control-plane
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
