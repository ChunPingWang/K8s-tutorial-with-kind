# Multi-container Pod：展示 Init Container 與 Sidecar 模式
# CKAD 考點：多容器 Pod 設計模式
#
# Init Container: 在主容器啟動前執行初始化任務
# Sidecar:        與主容器一起運行，提供輔助功能（如日誌收集）
apiVersion: v1
kind: Pod
metadata:
  name: multi-container-demo
  namespace: demo
  labels:
    app: multi-container-demo
spec:
  # ---- Init Container：在主容器前執行 ----
  initContainers:
    - name: init-setup
      image: busybox:1.36
      command: ['sh', '-c']
      args:
        - |
          echo "$(date) - Init container starting..." > /work-dir/init.log
          echo "Preparing application environment..."
          echo "ready" > /work-dir/status
          echo "$(date) - Init container completed."
      volumeMounts:
        - name: shared-data
          mountPath: /work-dir

  containers:
    # ---- 主容器：應用程式 ----
    - name: app
      image: busybox:1.36
      command: ['sh', '-c']
      args:
        - |
          echo "Main app started, checking init status..."
          cat /shared/init.log
          echo "App is running..."
          while true; do
            echo "$(date) - App heartbeat" >> /shared/app.log
            sleep 10
          done
      volumeMounts:
        - name: shared-data
          mountPath: /shared
      resources:
        requests:
          memory: "32Mi"
          cpu: "50m"
        limits:
          memory: "64Mi"
          cpu: "100m"

    # ---- Sidecar 容器：日誌收集 ----
    - name: log-collector
      image: busybox:1.36
      command: ['sh', '-c']
      args:
        - |
          echo "Log collector sidecar started..."
          while true; do
            if [ -f /shared/app.log ]; then
              echo "[LOG-COLLECTOR] $(tail -1 /shared/app.log)"
            fi
            sleep 15
          done
      volumeMounts:
        - name: shared-data
          mountPath: /shared
      resources:
        requests:
          memory: "16Mi"
          cpu: "25m"
        limits:
          memory: "32Mi"
          cpu: "50m"

  volumes:
    - name: shared-data
      emptyDir: {}
