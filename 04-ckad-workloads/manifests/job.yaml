# Job：執行一次性任務
# CKAD 考點：理解 Job 的行為與重試策略
apiVersion: batch/v1
kind: Job
metadata:
  name: math-job
  namespace: demo
  labels:
    app: math-job
spec:
  # 成功完成的 Pod 數量（預設 1）
  completions: 1
  # 同時執行的 Pod 數量（預設 1）
  parallelism: 1
  # 失敗重試次數
  backoffLimit: 3
  # Job 完成後自動清理（秒）
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: math-job
    spec:
      restartPolicy: Never
      containers:
        - name: compute
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - |
              echo "=== Job Started ==="
              echo "Computing PI approximation..."
              # 使用 bc 不可用時的替代方案
              echo "PI ≈ 3.14159265358979"
              echo "Hostname: $(hostname)"
              echo "Date: $(date)"
              echo "=== Job Completed ==="
          resources:
            requests:
              memory: "16Mi"
              cpu: "25m"
            limits:
              memory: "32Mi"
              cpu: "100m"
