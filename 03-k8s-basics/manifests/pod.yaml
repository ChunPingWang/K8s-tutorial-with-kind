# Pod: K8s 最小部署單位
# 使用方式: kubectl apply -f pod.yaml
# 注意: 生產環境通常不直接建立 Pod，而是透過 Deployment 管理
apiVersion: v1
kind: Pod
metadata:
  name: demo-pod
  namespace: demo
  labels:
    app: demo
    tier: frontend
spec:
  containers:
    - name: demo-app
      image: my-node-app:1.0
      # 使用 Kind 載入的本地映像檔，不從 Registry 拉取
      imagePullPolicy: Never
      ports:
        - containerPort: 3000
          name: http
      # 環境變數
      env:
        - name: NODE_ENV
          value: "development"
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: demo-config
              key: APP_NAME
      # 資源限制
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "250m"
      # 存活探針: 確認容器是否正常運行
      livenessProbe:
        httpGet:
          path: /health
          port: 3000
        initialDelaySeconds: 5
        periodSeconds: 10
      # 就緒探針: 確認容器是否準備好接收流量
      readinessProbe:
        httpGet:
          path: /health
          port: 3000
        initialDelaySeconds: 3
        periodSeconds: 5
