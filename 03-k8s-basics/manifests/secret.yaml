# Secret: 儲存機密資料（Base64 編碼）
# 使用方式: kubectl apply -f secret.yaml
#
# Base64 編碼方式:
#   echo -n 'admin' | base64        → YWRtaW4=
#   echo -n 'p@ssw0rd123' | base64  → cEBzc3cwcmQxMjM=
#
# 注意: Base64 不是加密！生產環境建議搭配 Vault 或 Sealed Secrets
apiVersion: v1
kind: Secret
metadata:
  name: demo-secret
  namespace: demo
type: Opaque
data:
  DB_USER: YWRtaW4=
  DB_PASSWORD: cEBzc3cwcmQxMjM=
