# Deployment: 管理 Pod 的副本數量、滾動更新與回滾
# 使用方式: kubectl apply -f deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
  labels:
    app: demo
spec:
  # 副本數量
  replicas: 3
  # 選擇器: 指定管理哪些 Pod
  selector:
    matchLabels:
      app: demo
  # 滾動更新策略
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # 更新時最多多出 1 個 Pod
      maxUnavailable: 0    # 更新時不允許有 Pod 不可用
  # Pod 模板
  template:
    metadata:
      labels:
        app: demo
        tier: frontend
    spec:
      containers:
        - name: demo-app
          image: my-node-app:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: demo-config
                  key: APP_NAME
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: demo-config
                  key: LOG_LEVEL
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
