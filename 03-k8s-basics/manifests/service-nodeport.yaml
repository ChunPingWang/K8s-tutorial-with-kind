# Service (NodePort): 透過節點埠對外暴露
# 使用方式: kubectl apply -f service-nodeport.yaml
# 可透過 <NodeIP>:30080 從外部存取
apiVersion: v1
kind: Service
metadata:
  name: demo-app-service
  namespace: demo
  labels:
    app: demo
spec:
  type: NodePort
  selector:
    app: demo
  ports:
    - name: http
      protocol: TCP
      port: 80           # Service 對外的埠
      targetPort: 3000   # Pod 的實際埠
      nodePort: 30080    # 節點對外的埠（範圍: 30000-32767）
