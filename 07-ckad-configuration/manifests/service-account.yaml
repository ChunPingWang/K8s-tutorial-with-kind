# ServiceAccount：為 Pod 提供身份識別
# CKAD 考點：建立 ServiceAccount 並在 Pod 中使用
#
# ServiceAccount 用途:
# - 控制 Pod 對 K8s API 的存取權限
# - 搭配 RBAC 限制 Pod 可以執行的操作
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  namespace: demo
  labels:
    app: demo

---
# 使用 ServiceAccount 的 Pod
apiVersion: v1
kind: Pod
metadata:
  name: sa-demo-pod
  namespace: demo
  labels:
    app: sa-demo
spec:
  serviceAccountName: app-service-account
  # 不自動掛載 API Token（安全最佳實踐）
  automountServiceAccountToken: false
  containers:
    - name: app
      image: busybox:1.36
      command: ['sh', '-c', 'sleep 3600']
      resources:
        requests:
          memory: "16Mi"
          cpu: "25m"
        limits:
          memory: "32Mi"
          cpu: "50m"
