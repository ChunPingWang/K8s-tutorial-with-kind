# Secret 以 Volume 方式掛載
# CKAD 考點：Secret 的使用方式（env vs volume）
---
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: demo
type: Opaque
data:
  # echo -n 'my-cert-data' | base64
  tls.crt: bXktY2VydC1kYXRh
  # echo -n 'my-key-data' | base64
  tls.key: bXkta2V5LWRhdGE=

---
apiVersion: v1
kind: Pod
metadata:
  name: secret-volume-demo
  namespace: demo
  labels:
    app: secret-volume-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ['sh', '-c']
      args:
        - |
          echo "=== Secret as Volume ==="
          echo "Files in /certs:"
          ls -la /certs/
          echo ""
          echo "--- tls.crt ---"
          cat /certs/tls.crt
          echo ""
          echo "--- tls.key ---"
          cat /certs/tls.key
          echo ""
          echo "File permissions (should be 0400):"
          stat -c "%a %n" /certs/*
          sleep 3600
      volumeMounts:
        - name: secret-volume
          mountPath: /certs
          readOnly: true
      resources:
        requests:
          memory: "16Mi"
          cpu: "25m"
        limits:
          memory: "32Mi"
          cpu: "50m"

  volumes:
    - name: secret-volume
      secret:
        secretName: tls-secret
        # 設定檔案權限
        defaultMode: 0400
