# LimitRange：設定 Namespace 中容器的預設和最大資源限制
# CKAD 考點：理解 LimitRange 如何為容器設定預設值
apiVersion: v1
kind: LimitRange
metadata:
  name: demo-limits
  namespace: demo
spec:
  limits:
    - type: Container
      # 預設 Limits（未指定時自動套用）
      default:
        cpu: "200m"
        memory: "128Mi"
      # 預設 Requests（未指定時自動套用）
      defaultRequest:
        cpu: "50m"
        memory: "32Mi"
      # 最大允許值
      max:
        cpu: "1"
        memory: "512Mi"
      # 最小允許值
      min:
        cpu: "10m"
        memory: "8Mi"
